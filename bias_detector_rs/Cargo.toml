[package]
name = "bias_detector_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
ort = { version = "=2.0.0-rc.1", features = ["ndarray"] }
ort-sys = "=2.0.0-rc.1"
ndarray = "0.15"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
rusqlite = { version = "0.29", features = ["bundled"] }
rustfft = "6.1"
num-complex = "0.4"
num-integer = "0.1"
rayon = "=1.10.0"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa", "sha256", "arithmetic"] }
bs58 = "0.5"
sha2 = "0.10"
ripemd = "0.1"
chrono = "0.4"
