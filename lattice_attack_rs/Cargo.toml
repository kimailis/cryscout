[package]
name = "lattice_attack_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
num-rational = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
k256 = { version = "0.13", features = ["ecdsa", "sha256", "arithmetic"] }
rusqlite = { version = "0.29", features = ["bundled"] }
rayon = "=1.10.0"
hex = "0.4"
nalgebra = "0.32"
float-ord = "0.3"
bs58 = "0.5"
sha2 = "0.10"
ripemd = "0.1"
