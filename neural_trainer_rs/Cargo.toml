[package]
name = "neural_trainer_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
k256 = { version = "0.13", features = ["ecdsa", "sha256", "arithmetic"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
num-rational = "0.4"
rusqlite = { version = "0.29", features = ["bundled"] }
anyhow = "1.0"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
ripemd = "0.1"
bs58 = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
