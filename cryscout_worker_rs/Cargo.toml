[package]
name = "cryscout_worker_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.29", features = ["bundled"] }
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "=4.4.18", features = ["derive"] }
sysinfo = "0.30"
chrono = "0.4"
rayon = "=1.10.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
hex = "0.4"
sha2 = "0.10"
ripemd = "0.1"
bs58 = "0.5"
k256 = { version = "0.13", features = ["ecdsa", "sha256", "arithmetic"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-integer = "0.1"
num-traits = "0.2"
num-complex = "0.4"
rustfft = "6.1"
nalgebra = "0.31" # Downgraded
float-ord = "0.3"
async-trait = "0.1"
futures = "0.3"
rand = "0.8"
libc = "0.2"

# Explicitly add ort dependencies to constrain versions
ort = "=2.0.0-rc.1"
ort-sys = "=2.0.0-rc.1"
ndarray = "0.15"
