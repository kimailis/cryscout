[package]
name = "address_analyzer_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
futures = "0.3"
futures-util = "0.3"
rand = "0.8"
async-trait = "0.1"
libc = "0.2"
rayon = "=1.10.0"
