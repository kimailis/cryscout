[package]
name = "neural_scout_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
bitcoin = { version = "0.30", features = ["rand", "serde"] }
bip39 = { version = "2.0", features = ["rand"] }
rusqlite = { version = "0.29", features = ["bundled"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
hex = "0.4"
rayon = "1.10"
rand = "0.8"
sysinfo = "0.30"
