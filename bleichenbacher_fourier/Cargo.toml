[package]
name = "bleichenbacher_fourier"
version = "0.1.0"
edition = "2021"

[dependencies]
num-bigint = { version = "0.4.6", features = ["serde"] }
num-traits = "0.2.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10.0"
rust-crypto = "0.2"
hex = "0.4"
rand = "0.8"
complex = "0.5" # Not strictly needed if we use manual complex math
num-complex = "0.4"
