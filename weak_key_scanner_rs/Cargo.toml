[package]
name = "weak_key_scanner_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
bitcoin = { version = "0.30", features = ["serde"] }
secp256k1 = { version = "0.27", features = ["rand-std"] }
rusqlite = { version = "0.29", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
rayon = "1.10"
num-bigint = "0.4"
num-traits = "0.2"
clap = { version = "4.4", features = ["derive"] }
sysinfo = "0.30"
